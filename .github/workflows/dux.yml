# Gate for the @mszr/idb-dux maintainer workspace (dux-spec-workspace.md → W3).
# Runs on dux workspace changes and changes to the upstream packages dux wraps or
# tests against: workspace lint, build all six entrypoints, the full Vitest suite
# (runtime / type-shape / dx / parity / compat, locked by `vitest run --typecheck`),
# and the baseline drift check. Demo typecheck/build is local/release-only — demos
# may reference the package via link/tarball/npm, so their resolutions are not CI-stable.
name: dux CI

on:
  push:
    paths:
      - 'client/package.json'
      - 'client/pnpm-lock.yaml'
      - 'client/pnpm-workspace.yaml'
      - 'client/turbo.json'
      - 'client/packages/admin/**'
      - 'client/packages/core/**'
      - 'client/packages/dux/**'
      # demo and sandbox excluded — their package resolutions vary by mode (link/tarball/npm)
      - '!client/packages/dux/idb-dux/demo/**'
      - '!client/packages/dux/sandbox/**'
      - 'client/packages/platform/**'
      - 'client/packages/resumable-stream/**'
      - 'client/packages/version/**'
      - 'client/packages/vue/**'
      - 'client/packages/webhooks/**'
      - '.github/workflows/dux.yml'
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'client/package.json'
      - 'client/pnpm-lock.yaml'
      - 'client/pnpm-workspace.yaml'
      - 'client/turbo.json'
      - 'client/packages/admin/**'
      - 'client/packages/core/**'
      - 'client/packages/dux/**'
      # demo and sandbox excluded — their package resolutions vary by mode (link/tarball/npm)
      - '!client/packages/dux/idb-dux/demo/**'
      - '!client/packages/dux/sandbox/**'
      - 'client/packages/platform/**'
      - 'client/packages/resumable-stream/**'
      - 'client/packages/version/**'
      - 'client/packages/vue/**'
      - 'client/packages/webhooks/**'
      - '.github/workflows/dux.yml'

jobs:
  dux:
    name: Lint, build, test, drift
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # Drift check reads git history since the vendored commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: '10.2.0'

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Get pnpm cache directory path
        id: pnpm-cache-dir-path
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: client
        run: pnpm i --frozen-lockfile --prefer-offline

      - name: Lint workspace
        working-directory: client/packages/dux
        run: pnpm run lint

      - name: Build all entrypoints
        working-directory: client/packages/dux
        run: pnpm run sdk:build:all

      - name: Full suite (runtime / types / dx / parity / compat)
        working-directory: client/packages/dux
        run: pnpm run sdk:test

      - name: Baseline drift check
        working-directory: client/packages/dux
        run: pnpm run sdk:check-baseline-drift
