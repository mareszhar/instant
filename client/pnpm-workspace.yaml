packages:
  - 'packages/*'
  - 'packages/dux/idb-dux'
  - 'sandbox/*'
  - 'www'
  - 'www/_emails/replace-images'

overrides:
  caniuse-lite: 1.0.30001790

verifyDepsBeforeRun: false

allowBuilds:
  '@clerk/shared': true
  '@firebase/util': true
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  protobufjs: true
  sharp: true

minimumReleaseAge: 5760
minimumReleaseAgeExclude:
  - '@mszr/*'
